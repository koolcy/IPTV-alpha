services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - ./worker:/app/worker
      - worker_node_modules:/app/worker/node_modules
    working_dir: /app/worker
    command: npm run dev -- --host 0.0.0.0 --port 8787

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0

volumes:
  worker_node_modules:
  admin_node_modules:
